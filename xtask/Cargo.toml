[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
nonmax = { workspace = true }
# Reading the dumps and generating tables from them. Nothing here launches a
# game: `dump` drives one through a shell, and everything that needs the game as
# a library lives in `sts2-golden`.
#
# Not `sts2-content`, which is what this writes. A generator that has to
# compile its own output cannot regenerate a tree its last change broke.
sts2-core = { workspace = true }
# Drawing `trace`'s folded stacks as a flamegraph. Nothing here uses the
# command-line half.
inferno = { version = "0.12", default-features = false }
# Reading the heap profile `allocations` has DHAT write.
serde_json = { workspace = true }
