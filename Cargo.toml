[workspace]
resolver = "3"
members = [
    "crates/sts2-cli",
    "crates/sts2-content",
    "crates/sts2-content-wire",
    "crates/sts2-core",
    "crates/sts2-golden",
    "crates/sts2-headless",
    "crates/sts2-sim",
    "crates/sts2-trace",
    "xtask",
]

# Shared dependencies live here and members say `workspace = true`, so a version
# is chosen once. Before this, `thiserror` was "2.0.20" in one crate and "2" in
# another. That resolved to the same version, with two places to change it.
[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
indexmap = "2"
# The transcendentals the gaussian draws need, compiled in rather than taken
# from whatever libm the target has. See `sts2-core/src/rng`.
libm = "0.2"
nonmax = { version = "0.5.5", features = ["serde"] }
num-traits = "0.2"
# The TUI. It reaches its `crossterm` backend through `ratatui::crossterm`
# rather than as a second dependency. So the key and resize events that the
# front end matches on cannot drift from the backend's.
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
serial_test = "4.0.1"
# Default features off here, so a dependent takes the trait with no build
# attached. Anything that needs the tables opts in with `features`.
sts2-content = { path = "crates/sts2-content", default-features = false }
sts2-content-wire = { path = "crates/sts2-content-wire" }
sts2-core = { path = "crates/sts2-core" }
sts2-headless = { path = "crates/sts2-headless" }
sts2-sim = { path = "crates/sts2-sim" }
thiserror = "2.0.20"
# Spans and events stay in the code, and a release build compiles every one of
# them out: `release_max_level_off` applies wherever `debug_assertions` is off.
# A build that traces is one with debug assertions on, which is a dev build or
# the `profiling` profile below.
tracing = { version = "0.1", default-features = false, features = ["attributes", "std", "release_max_level_off"] }

[profile.release]
debug = true
# One unit, so the optimiser sees a whole crate at once, and fat LTO, so it sees
# across crates. The rules are monomorphised in the simulator, but every table
# lookup and content hook they call is defined in the build's own crate.
codegen-units = 1
lto = "fat"

# Release, with tracing compiled in. It is what a trace is measured on.
#
# `tracing` works out its static level from its own debug assertions, so they
# are on for that crate alone. Every other crate compiles as release does. On
# for every crate, they turn on the checks inside hash maps and small vectors,
# which doubled what map generation cost.
[profile.profiling]
inherits = "release"

[profile.profiling.package.tracing]
debug-assertions = true
