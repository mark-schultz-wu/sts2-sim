name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones aimed at main. Work arrives here as a
  # stack, and a pull request onto the branch below it in the stack is the
  # normal case, not the exception.
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v6

      # A step's exit status is its last command's, and that last command is an
      # echo that always succeeds. So `set -e` to stop at the first failure, and
      # a version check at the end to assert the thing is actually there: a
      # toolchain step that installs nothing must not pass.
      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.96.0 --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version

      - name: Test
        run: cargo test --workspace

      - name: Lint prose
        run: ./tools/prose-lint.py

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

  # The C# side. Separate from `check` because it shares nothing with it: a
  # different toolchain, and the game's own assemblies, which have to be
  # fetched before anything will compile.
  mods:
    runs-on: docker
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@v6

      # -L is not optional: dot.net answers 301 to builds.dotnet.microsoft.com,
      # and a 301 is not an error to `curl -f`, so without it curl writes an
      # empty file and exits 0, bash runs the empty file and exits 0, and the
      # step goes green having installed nothing. `set -e` and the closing
      # version check are the same lesson as the Rust step above.
      - name: Install the .NET SDK
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            -o /tmp/dotnet-install.sh https://dot.net/v1/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --version

      # The three assemblies, not the 2.0G install: CI compiles the mods, it
      # does not run the game. One set per lock under mod/games/, into the
      # per-version directory `mod/build.sh` reads by default -- which is why
      # nothing here overrides Sts2PinDir or Sts2GameDir.
      - name: Fetch the pinned assemblies
        env:
          STS2_FORGE_TOKEN: ${{ secrets.STS2_FORGE_TOKEN }}
          STS2_FORGE_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          for lock in mod/games/*.lock; do
            ./mod/game.sh fetch "$(basename "$lock" .lock)"
          done

      # Every build with a lock, which is `just mods`. One adapter under each
      # mod's Compat/ is selected by that lock, so a change that compiles only
      # against the build you happen to have pinned is a change that breaks the
      # other, and this is where that is caught.
      - name: Build the mods
        run: |
          set -euo pipefail
          for lock in mod/games/*.lock; do
            version="$(basename "$lock" .lock)"
            echo "==> $version"
            STS2_GAME_VERSION="$version" ./mod/build.sh
          done
