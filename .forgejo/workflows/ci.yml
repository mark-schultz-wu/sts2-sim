name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only the ones aimed at main. Work arrives here as a
  # stack, and a pull request onto the branch below it in the stack is the
  # normal case, not the exception.
  pull_request:
  workflow_dispatch:

# `runs-on: sts2` is this repository's own runner image, built from
# `.forgejo/runner/`, which bakes the Rust and .NET toolchains. Nothing here
# installs one. See that directory for how the image is built and how the
# runner is told about it.
#
# It is a label of its own rather than `docker`, which stays pointed at the
# stock image. A branch whose workflow still installs its own toolchain cannot
# run on this image, because rustup refuses to install over one that is there
# already. So both labels exist until nothing asks for the stock one.
#
# Each job still asserts that the toolchain it found is the one the repository
# asked for. An image lives on a machine rather than in a commit, so it can go
# stale. A stale one has to fail the run rather than quietly test the wrong
# compiler.
jobs:
  check:
    runs-on: sts2
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        # `sts2-checkout` is baked into the runner image. Fetching an action
        # to do this made every job wait on a name resolving. That is the last
        # thing outside this image that can fail a run whose code is fine.
        env:
          # This run's own token, which is what the action it replaces used.
          # The package token beside it reaches the game's assemblies and not
          # the repository.
          GITHUB_TOKEN: ${{ github.token }}
        run: sts2-checkout

      - name: Check the toolchain is the one the image should bake
        run: |
          set -euo pipefail
          . .forgejo/runner/versions.env
          test "$(cat /etc/sts2-ci.digest)" = "$(.forgejo/runner/digest.sh)"
          test "$(cargo --version | cut -d' ' -f2)" = "$RUST_VERSION"
          rustup component list --installed | grep -q '^clippy'
          rustup component list --installed | grep -q '^rustfmt'

      # Every pinned build's tables come with the crate, so the workspace run
      # is the whole of it. There is no feature to name and no second pass.
      - name: Test
        run: |
          set -euo pipefail
          cargo test --workspace --exclude sts2-golden
          # The scenarios read what the game answered from `scenarios.bin`, so
          # they hold the simulator to a real game without launching one.
          cargo test -p sts2-golden --test scenarios

      # What lets a review skip the generated tables. `codegen` runs for every
      # pinned build and the tree has to come back unchanged. A hand edit to a
      # generated file, or a generator whose output nobody refreshed, fails here
      # rather than as a divergence nobody can place.
      - name: Check the generated tables reproduce
        run: |
          set -euo pipefail
          builds=0
          for lock in mod/games/*.lock; do
            STS2_GAME_VERSION="$(basename "$lock" .lock)" cargo run -q -p xtask -- codegen
            builds=$((builds + 1))
          done
          test "$builds" -gt 0
          git diff --exit-code -- 'crates/sts2-content/src/*/generated'

      - name: Lint prose structure
        run: ./tools/prose-lint.py

      # The whole repository, not only the lines this branch changed. The rules
      # hold everywhere, so a file that no commit here touches still has to
      # pass. `--self-test` runs first, because a rule that matches nothing
      # reports a clean repository for the wrong reason.
      - name: Lint prose style
        run: |
          ./tools/vale-lint.py --self-test
          ./tools/vale-lint.py
          ./tools/vale-lint.py --commits

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

  # The C# side. Separate from `check` because it shares nothing with it: a
  # different toolchain, and the game's own assemblies, which have to be
  # fetched before anything will compile.
  mods:
    runs-on: sts2
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        # `sts2-checkout` is baked into the runner image. Fetching an action
        # to do this made every job wait on a name resolving. That is the last
        # thing outside this image that can fail a run whose code is fine.
        env:
          # This run's own token, which is what the action it replaces used.
          # The package token beside it reaches the game's assemblies and not
          # the repository.
          GITHUB_TOKEN: ${{ github.token }}
        run: sts2-checkout

      - name: Check the toolchain is the one the image should bake
        run: |
          set -euo pipefail
          . .forgejo/runner/versions.env
          test "$(cat /etc/sts2-ci.digest)" = "$(.forgejo/runner/digest.sh)"
          case "$(dotnet --version)" in "$DOTNET_CHANNEL".*) ;; *) exit 1 ;; esac

      # The three assemblies, not the 2.0G install: CI compiles the mods, it
      # does not run the game. One set per lock under mod/games/, into the
      # per-version directory `mod/build.sh` reads by default. That is why
      # nothing here overrides Sts2PinDir or Sts2GameDir.
      #
      # This is the one fetch left in the workflow. It is the one thing a job
      # needs that an image cannot hold. The assemblies are the game's, and they
      # come from the forge with this run's token.
      - name: Fetch the pinned assemblies
        env:
          STS2_FORGE_TOKEN: ${{ secrets.STS2_FORGE_TOKEN }}
          STS2_FORGE_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          for lock in mod/games/*.lock; do
            ./mod/game.sh fetch "$(basename "$lock" .lock)"
          done

      # Every build with a lock, which is `just mods`. One adapter under each
      # mod's Compat/ is selected by that lock. So a change that compiles only
      # against the build you pinned breaks the other build. This job is where
      # that shows up.
      - name: Build the mods
        run: |
          set -euo pipefail
          for lock in mod/games/*.lock; do
            version="$(basename "$lock" .lock)"
            echo "==> $version"
            STS2_GAME_VERSION="$version" ./mod/build.sh
          done

  # A recording belongs to one game build: its indices mean whatever that
  # build dealt. This job owns the complete pinned installation and replays the
  # recording into it once. The tests then read the cached answers.
  #
  # The answers outlive the job in the `sts2-oracle` volume, which the runner
  # mounts into every job it starts. So a job asks the game only for the
  # recordings no earlier job answered.
  golden:
    runs-on: sts2
    timeout-minutes: 45
    env:
      STS2_GAME_VERSION: v0.107.1
      STS2_GAME_DIR: /opt/sts2/share/sts2/games/v0.107.1
      STS2_ORACLE_STORE: /var/cache/sts2-oracle
    steps:
      - name: Check out the repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sts2-checkout

      - name: Check the pinned game
        run: |
          set -euo pipefail
          test -x "$STS2_GAME_DIR/SlayTheSpire2"
          test "$(cat "$STS2_GAME_DIR/.pinned-version")" = \
            "$(sed -n 's/^# version: //p' "mod/games/$STS2_GAME_VERSION.lock")"

      - name: Build and install the mods
        run: ./mod/deploy.sh

      # Without the volume the store is a directory inside the container, and
      # every job records every transcript again.
      - name: Check the oracle store is mounted
        run: grep -q " $STS2_ORACLE_STORE " /proc/mounts

      - name: Replay the golden runs
        run: cargo test -p sts2-golden -- --nocapture

      # A hit moves a transcript's time, so what is still in use stays. A
      # partial file is a job that died while storing.
      - name: Prune the oracle store
        run: |
          set -euo pipefail
          find "$STS2_ORACLE_STORE" -name '*.jsonl' -mtime +30 -print -delete
          find "$STS2_ORACLE_STORE" -name '*.partial' -mmin +60 -print -delete

      - name: Check the mod inside the game
        run: |
          set -euo pipefail
          for mode in selftest determinism; do
            echo "==> $mode"
            (cd "$STS2_GAME_DIR" && timeout -k 5 300 env LD_PRELOAD=libgcc_s.so.1 \
              STS2_HEADLESS_MODE="$mode" ./SlayTheSpire2 --headless --force-steam=off)
          done
