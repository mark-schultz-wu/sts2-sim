[package]
name = "sts-schema"
version = "0.0.0"
edition = "2024"
description = "Normalized state and action vocabulary shared by the simulator and both oracles"

[dependencies]
nonmax = { version = "0.5.5", default-features = false, features = ["serde"] }
rand = { version = "0.10.2", default-features = false, features = ["unbiased"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tinyvec = { version = "1.12.0", default-features = false, features = ["alloc", "serde"] }
