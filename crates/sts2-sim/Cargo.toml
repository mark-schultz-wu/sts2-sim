[package]
name = "sts2-sim"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
tracing = { workspace = true }
bitfield-struct = "0.13.0"
# Turns the rules that pause on a question into states that clone. See
# docs/ASYNC.md, and vendor/README.md for why the version is pinned.
diapause = { workspace = true }
# The vocabulary both implementations speak. See docs/STS2-CORE.md.
indexmap = { workspace = true }
nonmax = { workspace = true }
num-traits = { workspace = true }
smallvec = { workspace = true }
sts2-core = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The `at` a test spells a creature with. See `sts2_core::fixture`.
sts2-core = { workspace = true, features = ["fixture"] }
# A unit test drives a rule, and a rule is written against one build's tables.
sts2-content = { workspace = true }
# `fight_bench`'s arguments.
clap = { workspace = true }
