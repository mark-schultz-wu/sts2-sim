[package]
name = "sts2-headless"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
nonmax = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The decisions, the recording format, the build stamp and `ContentVersion`:
# what this crate is an implementation *of*. See docs/STS2-CORE.md.
#
# No dependency on `sts2-content` at all outside the tests. This code drives a
# game generically over the build, so nothing here needs a build to exist. Only
# the tests do, because they must pick one to spell a decision.
sts2-core = { workspace = true }
sts2-content-wire = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The `at` a test spells a creature with. See `sts2_core::fixture`.
sts2-core = { workspace = true, features = ["fixture"] }
# The tests and examples do name a build, because driving a real game means
# picking one.
sts2-content = { workspace = true }
serial_test = { workspace = true }
