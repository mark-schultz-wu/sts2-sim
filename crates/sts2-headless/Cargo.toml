[package]
name = "sts2-headless"
version = "0.1.0"
edition = "2024"

[dependencies]
nonmax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The trait only. A transport that is generic over the build has no business
# compiling one, and with default features it was pulling in all fourteen
# generated domains to reach `ContentVersion`.
sts2-content = { workspace = true }
sts2-rng = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
# The tests and examples do name a build, because driving a real game means
# picking one.
sts2-content = { workspace = true, features = ["v0_107_1"] }
serial_test = { workspace = true }
