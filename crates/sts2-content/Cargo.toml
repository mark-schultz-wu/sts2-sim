[package]
name = "sts2-content"
version = "0.1.0"
edition = "2024"
readme = "README.md"

# One module per game build, each behind a feature. The types stay distinct, so
# one binary can compare two versions. A caller that wants one version does not
# compile 578 cards for the other.
[features]
default = ["v0_107_1"]
v0_107_1 = []
v0_111_0 = []

[dependencies]
# The traits these tables implement. See docs/STS2-CORE.md.
sts2-core = { workspace = true }
# A ported card reads what it prints, which is a build's own representation.
num-traits = { workspace = true }
nonmax = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
