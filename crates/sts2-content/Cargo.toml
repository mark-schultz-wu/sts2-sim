[package]
name = "sts2-content"
version = "0.1.0"
edition = "2024"
readme = "README.md"

# One module per game build. The types stay distinct, so one binary can compare
# two versions.
#
# No feature per build. The point of one was to keep an unwanted build out of a
# binary, and the linker already does that. A build nothing names has statics
# nothing references, and dropping the second one measured at zero bytes.
#
# What a feature bought instead was compile time. Nothing here collects it:
# `sts2-cli` dispatches on the version at run time, so it names every build and
# the workspace compiles them all anyway. Add features back when a binary wants
# one build out of many and the compile is what hurts.

[dependencies]
# The traits these tables implement. See docs/STS2-CORE.md.
sts2-core = { workspace = true }
# A ported card reads what it prints, which is a build's own representation.
num-traits = { workspace = true }
nonmax = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
