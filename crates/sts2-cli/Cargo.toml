[package]
name = "sts2-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"

# Tools that drive the game, kept out of the library. So `sts2-headless` stays
# a transport with no opinion about its callers. A second front end, such as a
# TUI, is then a sibling here rather than a fork of it.
#
# These are binaries rather than examples because they are used, not read.
# `sts2-headless/examples/scenario.rs` stays an example: its job is to be read.

[[bin]]
name = "sts2"
path = "src/main.rs"

# Random legal play. A tool rather than a test: it has no pass condition, it
# runs until it finds something or the run ends.
# The TUI over the simulator. No game and no daemon: the run lives in the
# process that draws it.

[dependencies]
thiserror = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
num-traits = { workspace = true }
ratatui = { workspace = true }
serde_json = { workspace = true }
sts2-content = { workspace = true }
sts2-content-wire = { workspace = true }
# The runner the screen plays a run through, as a player of it.
sts2-run = { workspace = true }
sts2-core = { workspace = true }
sts2-headless = { workspace = true }
sts2-sim = { workspace = true }

# The game's text, read from the player's install. `build.rs` says why.
[build-dependencies]
sha2 = { workspace = true }
sts2-pack = { workspace = true }

[dev-dependencies]
# The `at` a test spells a creature with. See `sts2_core::fixture`.
sts2-core = { workspace = true, features = ["fixture"] }
