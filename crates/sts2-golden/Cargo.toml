[package]
name = "sts2-golden"
version = "0.1.0"
edition = "2024"

# Nothing depends on this crate. It is where the simulator is held against the
# real game, so it depends on both and is depended on by neither.

[dependencies]
sts2-core = { workspace = true }
sts2-content-wire = { workspace = true }
sts2-headless = { workspace = true }
# The reviewable files spell an id by its game name, which is the serde rename.
serde = { workspace = true }
serde_json = { workspace = true }
# What reading the recorded runs finds wrong.
thiserror = { workspace = true }

[build-dependencies]
sts2-core = { workspace = true }
# The stamp a scenario file does not carry, written in front of one.
serde_json = { workspace = true }
# The build script fills the oracle cache, which means launching a real game and
# naming a build to launch it for.
sts2-content = { workspace = true }
sts2-headless = { workspace = true }

[dev-dependencies]
# The `at` a test spells a creature with. See `sts2_core::fixture`.
sts2-core = { workspace = true, features = ["fixture"] }
# Replaying a recording means spelling the decisions in it, which names a build.
sts2-content = { workspace = true }
sts2-sim = { workspace = true }
# The clock, with its own sampling and its own baselines. See the bench table
# below for why the allocator is counted somewhere else.
criterion = "0.8.2"
# The examples' arguments.
clap = { workspace = true }

# Two benches measure the clock and one measures the allocator, because one
# binary cannot do both. A counting allocator takes in criterion's own working
# memory, and criterion then samples a counter.
#
# `harness = false` on all three: criterion writes its own main, and the
# allocation bench writes a table.
[[bench]]
name = "replay"
harness = false

[[bench]]
name = "decision"
harness = false

[[bench]]
name = "allocations"
harness = false
