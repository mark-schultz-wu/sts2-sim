# The build of Slay the Spire 2 that this repository compiles and runs against.
#
# v0.107.1, the game's own commit 59260271, Steam buildid 23811903. The game is
# not ours to redistribute, so it lives in a private generic package on the
# forge and `mod/game.sh` moves it. What lives here is the pin: a hash for each
# file, which is what makes fetching it a pin rather than a download.
#
# The pin matters because the alternative is the Steam install, which is
# world-writable and updates on Steam's schedule. STS2 churns 20-50 cards on a
# minor version and 80-120 on a major, so a result that changed because Steam
# patched overnight does not look like a broken pin. It looks like a bug in the
# simulator.
#
# sts2.dll here is the assembly as shipped. An older workflow IL-patched it in
# place and kept the untouched copy as sts2.dll.original; nothing does that now,
# so the plain name is the honest one.
#
# The archive is the whole install minus `mods/` and `crates/`, which are ours
# rather than the game's. It unpacks to the directory .envrc names.
#
# To add a pin: add `mod/games/<version>.lock`, install that build, run
# `mod/game.sh publish <version>`, and write the hashes it prints in its lock.
#
# Not a build older than this one. v0.107.1 is where the game replaced its PRNG
# with xoshiro256**, and sts2-rng ports that generator alone. Older builds drew
# from C# System.Random, so their mods can compile and still agree on no number.
# crates/sts2-rng/README.md says what porting one would take.
#
# package: sts2-game
# version: 0.107.1-59260271
# assembly: 1692500715
# abi: counter-rng

